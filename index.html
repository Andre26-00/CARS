<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de los Hot Wheels</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <!-- INTRO -->
    <div class="intro">

        <div class="intro-content">

            <div class="intro-car-wrapper">

                <img src="hotwheels.jpg"
                    alt="Hot Wheels"
                    class="intro-car">

                <div class="smoke smoke1"></div>
                <div class="smoke smoke2"></div>
                <div class="smoke smoke3"></div>

                <div class="intro-track"></div>

            </div>

            <h1 class="intro_title">
                FELIZ DÍA DE LOS
                <span>HOT WHEELS</span>
            </h1>

            <p class="intro-message">
                Acelera para encender el motor y descubrir tu sorpresa.
            </p>

            <div class="intro-btn-wrap">

                <button class="intro-btn">
                    <span class="intro-btn-text">
                        <i class="fa-solid fa-key"></i>
                        INICIAR MOTOR
                    </span>
                </button>

            </div>

        </div>

    </div>

    <!-- CARROS -->
    <div id="cars"></div>

    <!-- MENSAJE FINAL -->
    <div id="mensaje-final">

        <h1>
            🚗 Feliz Día de los Hot Wheels 🚗
        </h1>

        <p>
            Que cada pista te lleve a nuevas aventuras,
            velocidad y diversión.
        </p>

    </div>

    <!-- RAMO -->

    <div class="ramo">

        <!-- TALLOS -->

        <div class="tallo" style="transform:rotate(-18deg);"></div>
        <div class="tallo" style="transform:rotate(-8deg);"></div>
        <div class="tallo" style="transform:rotate(8deg);"></div>
        <div class="tallo" style="transform:rotate(18deg);"></div>
        <div class="tallo" style="transform:rotate(-28deg);"></div>
        <div class="tallo" style="transform:rotate(-13deg);"></div>
        <div class="tallo" style="transform:rotate(0deg);"></div>
        <div class="tallo" style="transform:rotate(13deg);"></div>
        <div class="tallo" style="transform:rotate(28deg);"></div>

        <!-- HOJAS -->

        <div class="hoja hoja1"></div>
        <div class="hoja hoja2"></div>
        <div class="hoja hoja3"></div>
        <div class="hoja hoja4"></div>
        <div class="hoja hoja5"></div>
        <div class="hoja hoja6"></div>
        <div class="hoja hoja7"></div>
        <div class="hoja hoja8"></div>

        <!-- FLOR 1 -->

        <div class="girasol flor1">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="petalo p9"></div>
            <div class="petalo p10"></div>
            <div class="petalo p11"></div>
            <div class="petalo p12"></div>
            <div class="centro"></div>
        </div>

        <!-- FLOR 2 -->

        <div class="girasol flor2">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="petalo p9"></div>
            <div class="petalo p10"></div>
            <div class="petalo p11"></div>
            <div class="petalo p12"></div>
            <div class="centro"></div>
        </div>

        <!-- FLOR 3 -->

        <div class="girasol flor3">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="petalo p9"></div>
            <div class="petalo p10"></div>
            <div class="petalo p11"></div>
            <div class="petalo p12"></div>
            <div class="centro"></div>
        </div>

        <!-- FLOR 4 -->

        <div class="girasol flor4">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="petalo p9"></div>
            <div class="petalo p10"></div>
            <div class="petalo p11"></div>
            <div class="petalo p12"></div>
            <div class="centro"></div>
        </div>

        <!-- FLOR 5 -->

        <div class="girasol flor5">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="petalo p9"></div>
            <div class="petalo p10"></div>
            <div class="petalo p11"></div>
            <div class="petalo p12"></div>
            <div class="centro"></div>
        </div>

        <!-- ENVOLTURA -->

        <div class="envoltura"></div>
        <div class="papel"></div>
        <div class="lazo" aria-hidden="true"><span></span></div>

    </div>

</body>

</html>
